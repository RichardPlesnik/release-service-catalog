---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-artifacts-to-storage
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: push-rok-storage
spec:
  description: |-
    Tekton task to upload an RPM fixture to the test artifact storage domain.
  params:
    - name: snapshotPath
      type: string
      description: |
        Path to the JSON file of the mapped Snapshot spec in the data workspace
    - name: snapshotNamespace
      type: string
      description: |
        Namespace that tha snapshot originated from
    - name: snapshotBuildId
      type: string
      description: |
        Build Id that tha snapshot originated from
    - name: pipelineImage
      type: string
      description: |
        Currently unused. Preserving due to to backwards compatibility with existing 
        pipelines that use this task
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: dataPath
      type: string
      description: |
        Path to the JSON file of the merged data to use in the data workspace
    - name: pulpDomain
      type: string
      description: Pulp domain for uploading the test RPM fixture
      default: konflux-direct-signing-test
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
  volumes:
    - name: rok-access
      secret:
        secretName: rok-storage
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: download-test-rpm
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits:
          memory: 128Mi
          cpu: 100m
        requests:
          memory: 128Mi
          cpu: 50m
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        rpm_dir="/var/workdir/fixture-rpms"
        mkdir -p "${rpm_dir}"
        rpm_url="https://download-01.beak-001.prod.iad2.dc.redhat.com/brewroot/vol/rhel-9/"
        rpm_url+="packages/android-tools/35.0.1/1.el9_6iv/x86_64/android-tools-35.0.1-1.el9_6iv.x86_64.rpm"
        curl --retry 3 -sS --fail-with-body --location \
          --output "${rpm_dir}/android-tools-35.0.1-1.el9_6iv.x86_64.rpm" \
          "${rpm_url}"
    - name: push-artifacts-to-storage
      image: quay.io/redhat-user-workloads/artifact-storage-tenant/tooling/pulp-tool-container:latest
      computeResources:
        limits:
          memory: 256Mi
          cpu: 250m
        requests:
          memory: 256Mi
          cpu: 100m
      volumeMounts:
        - mountPath: /etc/rok-access
          name: rok-access
          readOnly: true
      env:
        - name: PULP_DOMAIN
          value: $(params.pulpDomain)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        set +x
        pulp_domain="${PULP_DOMAIN}"
        if [ "${pulp_domain}" != "konflux-direct-signing-test" ]; then
          echo "Fixture upload may only use konflux-direct-signing-test" >&2
          exit 1
        fi
        config="$(mktemp /tmp/pulp-config.XXXXXX)"
        trap 'rm -f "${config}"' EXIT
        chmod 600 "${config}"
        if ! base64 -d /etc/rok-access/cli.toml > "${config}" 2>/dev/null; then
          cp /etc/rok-access/cli.toml "${config}"
        fi
        grep -q '^domain = ' "${config}"
        sed -i "s/^domain = .*/domain = \"${pulp_domain}\"/" "${config}"
        grep -Fqx "domain = \"${pulp_domain}\"" "${config}"
        if ! pulp-tool --config "${config}" \
          --build-id "$(params.snapshotBuildId)" \
          --namespace "$(params.snapshotNamespace)" \
          upload --rpm-path /var/workdir/fixture-rpms \
          --artifact-results "$(params.dataDir)/artifacts" > /dev/null 2>&1; then
          echo "Pulp upload failed; tool output suppressed to protect credentials" >&2
          exit 1
        fi
        test -s "$(params.dataDir)/artifacts/pulp_results.json"
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
